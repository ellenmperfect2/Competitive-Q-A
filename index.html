<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orb vs Metronome — Docs Comparison</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
  }
  h1 { font-size: 22px; }
  textarea {
    width: 100%;
    height: 70px;
    font-size: 15px;
    padding: 10px;
    box-sizing: border-box;
  }
  button {
    margin-top: 10px;
    padding: 10px 18px;
    font-size: 15px;
    background: #111;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 30px;
  }
  .card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.5;
  }
  .card h2 { font-size: 15px; margin-top: 0; }
  .status { margin-top: 14px; color: #666; font-size: 14px; }
  @media (max-width: 600px) {
    .answers { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <h1>Orb vs Metronome — Docs Comparison</h1>
  <p>Type a question and it'll be sent to both products' documentation assistants.</p>

  <textarea id="question" placeholder="e.g. How do enterprise commits work?"></textarea>
  <br />
  <button id="askBtn" onclick="ask()">Ask both</button>
  <div class="status" id="status"></div>

  <div class="answers" id="answers" style="display:none">
    <div class="card">
      <h2>Metronome</h2>
      <div id="metronomeAnswer"></div>
    </div>
    <div class="card">
      <h2>Orb</h2>
      <div id="orbAnswer"></div>
    </div>
  </div>

<script>
async function ask() {
  const question = document.getElementById('question').value.trim();
  if (!question) return;

  const btn = document.getElementById('askBtn');
  const status = document.getElementById('status');
  const answers = document.getElementById('answers');

  btn.disabled = true;
  status.textContent = 'Asking both assistants... (usually 5–15 seconds)';
  answers.style.display = 'none';

  try {
    const resp = await fetch('/api/compare?question=' + encodeURIComponent(question));
    const data = await resp.json();

    if (data.error) {
      status.textContent = 'Error: ' + data.error;
    } else {
      document.getElementById('metronomeAnswer').textContent = data.metronome;
      document.getElementById('orbAnswer').textContent = data.orb;
      answers.style.display = 'grid';
      status.textContent = '';
    }
  } catch (e) {
    status.textContent = 'Something went wrong: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
